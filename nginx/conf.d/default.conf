    location /chains {
        root   /usr/share/nginx/html;
        expires 30d;

        # Base on: https://michielkalkman.com/snippets/nginx-cors-open-configuration/
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            #
